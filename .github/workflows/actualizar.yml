name: Actualizar cartera global

on:
  schedule:
    - cron: "0 21 * * *"      # 21:00 UTC = 18:00 en Buenos Aires (UTC-3, sin horario de verano)
  workflow_dispatch:           # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install -q pandas numpy requests openpyxl lxml selenium playwright
          python -m playwright install --with-deps chromium
      - name: Generar página
        run: python actualizar.py
      - name: Publicar cambios
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "Actualización automática $(date -u +%F)" || echo "Sin cambios"
          git push
