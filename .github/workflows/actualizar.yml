name: Actualizar cartera global

on:
  schedule:
    - cron: "0 21 * * *"      # 21:00 UTC = 18:00 en Buenos Aires (UTC-3, sin horario de verano)
  workflow_dispatch:           # también se puede lanzar a mano desde la pestaña Actions
  push:
    paths: ["activos.txt"]     # al editar activos.txt se regenera la página enseguida

permissions:
  contents: write

concurrency:                   # nunca dos corridas a la vez
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install -q pandas numpy requests openpyxl lxml selenium playwright yfinance
          python -m playwright install --with-deps chromium
      - name: Generar página
        run: python actualizar.py
      - name: Publicar cambios
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "Actualización automática $(date -u +%F)" || echo "Sin cambios"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
